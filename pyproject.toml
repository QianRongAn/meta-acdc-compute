[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-acdc"
version = "0.1.0"
description = "Meta-ACDC: deciphering the proteome-wide TCR cross-reactivity landscape via active meta-learning and synthetic immune cells"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
ml = ["torch==2.9.1+cu126", "torchvision==0.24.1+cu126", "torch-geometric"]

[tool.setuptools.packages.find]
where = ["src"]
